# CI gates for hiway-studio (plan docs/plans/2026-11-09-audit-roadmap-fixes, G0–G9).
# No secrets and no paid providers: every job runs on stub adapters.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (pytest strict + Postgres, lint, contracts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          # Name must end in "test": the suite refuses to reset anything else.
          POSTGRES_DB: hiway_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hiway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: System media tools (ffmpeg, CJK font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fontconfig
          fc-cache -f
      - name: Install API package
        run: pip install -e "services/api[test]"
      - name: G9 ruff
        run: python -m ruff check services/api/app services/api/tests
      - name: G4 import boundaries
        run: python tools/lint_imports.py
      - name: G5 generated contracts are current
        run: python packages/contracts/tools/gen_types.py --check
      - name: G7 compose ports bind to loopback
        run: |
          python tools/check_compose_loopback.py --self-test
          python tools/check_compose_loopback.py
      - name: G2 pytest (SQLite, media tools required)
        working-directory: services/api
        env:
          REQUIRE_MEDIA_TOOLS: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: G2 pytest (Postgres)
        working-directory: services/api
        env:
          REQUIRE_MEDIA_TOOLS: "1"
          TEST_DATABASE_URL: postgresql+psycopg://postgres:pw@127.0.0.1:5432/hiway_test
        run: python -m pytest -q -p no:cacheprovider

  web:
    name: web (typecheck, build, SSE client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Native EventSource (--experimental-eventsource) for tests/sse.test.mjs.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: G6 typecheck
        run: npx tsc --noEmit
      - name: G6 build
        run: npx next build
      - name: G6 SSE client contract
        run: npm run test:sse
      - name: G6 reconnect resync re-reads job state
        run: npm run test:resync

  image:
    name: image (Docker build, offline CJK burn-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (repo-root context)
        run: docker build -f services/api/Dockerfile -t hiway-studio-api:ci .
      - name: G3 Korean burn-in + thumbnail OCR, no network
        run: docker run --rm --network none hiway-studio-api:ci python /repo/tools/verify_cjk_burnin.py
